[project]
name = "jobagent"
version = "0.1.0"
description = "Personal job-hunt agent for the Indian job market: discover, score, tailor, apply, reach out."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14",
    "python-jobspy>=1.3",
    "playwright>=1.64",
    "sqlmodel>=0.0.24",
    "pydantic>=2.10",
    "jinja2>=3.1",
    "streamlit>=1.50",
    "httpx>=0.28",
    "selectolax>=0.3",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "python-docx>=1.2",
    "pypdf>=6.20.1",
    "dnspython>=2.9.0",
]

[project.scripts]
jobagent = "jobagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
